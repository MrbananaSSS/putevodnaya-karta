<script>
(function(){
  var isLocalFile=window.location.protocol==='file:';
  var loadingIndicator=document.getElementById('loadingIndicator');
  var loadProgress={total:0,loaded:0};
  
  function updateLoadingIndicator(){
    if(loadProgress.total===0){
      loadingIndicator.style.display='none';
      return;
    }
    var pct=Math.round((loadProgress.loaded/loadProgress.total)*100);
    loadingIndicator.textContent='Загрузка: '+pct+'%';
    if(pct>=100){
      setTimeout(function(){loadingIndicator.style.display='none'},500);
    }
  }
  
  function showLocalFileError(){
    var banner=document.createElement('div');
    banner.className='error-banner';
    banner.innerHTML='<strong>⚠️ Файл открыт локально</strong><br>Для загрузки изображений откройте через веб-сервер:<br><code>python -m http.server 8000</code><br>или загрузите на GitHub Pages';
    document.body.appendChild(banner);
  }
  
  async function loadAsset(url){
    if(isLocalFile){
      showLocalFileError();
      return null;
    }
    try{
      loadProgress.total++;
      var res=await fetch(url);
      if(!res.ok)throw new Error('HTTP '+res.status);
      var blob=await res.blob();
      loadProgress.loaded++;
      updateLoadingIndicator();
      return URL.createObjectURL(blob);
    }catch(e){
      console.error('Failed to load asset:',url,e);
      loadProgress.loaded++;
      updateLoadingIndicator();
      return null;
    }
  }
  
  function catmullRomToBezierPath(points){
    var n=points.length;
    if(n<2)return '';
    if(n===2)return 'M '+points[0].x+' '+points[0].y+' L '+points[1].x+' '+points[1].y;
    var d='M '+points[0].x+' '+points[0].y;
    for(var i=0;i<n-1;i++){
      var p1=points[i],p2=points[i+1];
      var prevP,nextP;
      if(i===0){prevP={x:2*p1.x-p2.x,y:2*p1.y-p2.y}}else{prevP=points[i-1]}
      if(i===n-2){nextP={x:2*p2.x-p1.x,y:2*p2.y-p1.y}}else{nextP=points[i+2]}
      var cp1x=p1.x+(p2.x-prevP.x)/6,cp1y=p1.y+(p2.y-prevP.y)/6;
      var cp2x=p2.x-(nextP.x-p1.x)/6,cp2y=p2.y-(nextP.y-p1.y)/6;
      d+=' C '+cp1x+' '+cp1y+' '+cp2x+' '+cp2y+' '+p2.x+' '+p2.y;
    }
    return d;
  }
  
  function crSamples(pts,per){
    per=per||16;
    var n=pts.length;
    if(n<2)return [];
    if(n===2)return [[pts[0].lat,pts[0].lng],[pts[1].lat,pts[1].lng]];
    var out=[];
    for(var i=0;i<n-1;i++){
      var p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];
      for(var t=0;t<per;t++){
        var s=t/per,s2=s*s,s3=s2*s;
        var lat=0.5*((2*p1.lat)+(-p0.lat+p2.lat)*s+(2*p0.lat-5*p1.lat+4*p2.lat-p3.lat)*s2+(-p0.lat+3*p1.lat-3*p2.lat+p3.lat)*s3);
        var lng=0.5*((2*p1.lng)+(-p0.lng+p2.lng)*s+(2*p0.lng-5*p1.lng+4*p2.lng-p3.lng)*s2+(-p0.lng+3*p1.lng-3*p2.lng+p3.lng)*s3);
        out.push([lat,lng]);
      }
    }
    out.push([pts[n-1].lat,pts[n-1].lng]);
    return out;
  }
  
  function fmtDesc(text){
    if(!text)return '';
    var lines=esc(text).split('\n');
    var html='',inList=false;
    for(var i=0;i<lines.length;i++){
      var t=lines[i].trim();
      if(t.length>1&&/^[•\-\*]\s*/.test(t)){
        if(!inList){html+='<ul>';inList=true}
        html+='<li>'+t.replace(/^[•\-\*]\s*/,'')+'</li>';
      }else{
        if(inList){html+='</ul>';inList=false}
        html+= t==='' ? '<br>' : '<p>'+t+'</p>';
      }
    }
    if(inList)html+='</ul>';
    return html;
  }
  
  function fmtDist(v){
    if(!v)return '';
    v=String(v).trim();
    return /^\d+(\.\d+)?$/.test(v)?v+' км':v;
  }
  
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

  var data=JSON.parse(document.getElementById('mapData').textContent);
  document.getElementById('headerTitle').textContent=data.title||data.name;
  var sub=document.getElementById('headerSub');
  if(data.subtitle)sub.textContent=data.subtitle;else sub.style.display='none';
  
  var accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#c9482a';
  var sorted=data.points.slice().sort(function(a,b){return a.order-b.order});
  var animateRoute=data.animateRoute!==false;
  
  // Load assets
  var assetUrls={};
  var assetPromises=[];
  
  if(data.assets){
    if(data.assets.map){
      assetPromises.push(loadAsset(data.assets.map).then(function(url){
        if(url)assetUrls.map=url;
      }));
    }
    
    if(data.assets.points){
      Object.keys(data.assets.points).forEach(function(pi){
        data.assets.points[pi].forEach(function(path,ii){
          assetPromises.push(loadAsset(path).then(function(url){
            if(url){
              if(!assetUrls.points)assetUrls.points={};
              if(!assetUrls.points[pi])assetUrls.points[pi]=[];
              assetUrls.points[pi][ii]=url;
            }
          }));
        });
      });
    }
    
    if(data.assets.videos){
      data.assets.videos.forEach(function(path,vi){
        assetPromises.push(loadAsset(path).then(function(url){
          if(url){
            if(!assetUrls.videos)assetUrls.videos=[];
            assetUrls.videos[vi]=url;
          }
        }));
      });
    }
  }
  
  Promise.all(assetPromises).then(function(){
    renderMap();
    renderPoints();
    renderVideos();
  });
  
  function renderMap(){
    if(data.mode==='photo'){
      if(assetUrls.map){
        document.getElementById('mapImg').src=assetUrls.map;
      }
      renderPhotoMap();
    }else{
      renderLiveMap();
    }
  }
  
  function renderPhotoMap(){
    var inner=document.getElementById('mapInner');
    var markers={};
    
    sorted.forEach(function(p,i){
      var m=document.createElement('div');
      m.className='marker';
      m.style.left=p.x+'%';
      m.style.top=p.y+'%';
      m.style.backgroundColor=p.color;
      m.innerHTML=p.icon?'<span class="micon">'+esc(p.icon)+'</span>':'<span class="num">'+(i+1)+'</span>';
      m.addEventListener('click',function(e){e.stopPropagation();showCard(p)});
      inner.appendChild(m);
      markers[p.id]=m;
    });
    
    var svg=document.getElementById('routeSvg');
    if(svg&&sorted.length>1&&data.showRoutes){
      for(var i=0;i<sorted.length-1;i++){
        var a=sorted[i],b=sorted[i+1];
        var key=a.id+'_'+b.id;
        var nodes=(data.curves&&data.curves[key])||[];
        var dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
        nodes=nodes.slice().sort(function(n1,n2){
          var t1=len2>0?((n1.x-a.x)*dx+(n1.y-a.y)*dy)/len2:0;
          var t2=len2>0?((n2.x-a.x)*dx+(n2.y-a.y)*dy)/len2:0;
          return t1-t2;
        });
        var pts=[{x:a.x,y:a.y}].concat(nodes).concat([{x:b.x,y:b.y}]);
        var animClass=animateRoute?'animated':'';
        var path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('class','route-path '+animClass);
        path.setAttribute('d',catmullRomToBezierPath(pts));
        svg.appendChild(path);
      }
      var last=sorted[sorted.length-1],prev=sorted[sorted.length-2];
      var adx=last.x-prev.x,ady=last.y-prev.y;
      var len=Math.sqrt(adx*adx+ady*ady)||1;
      var ux=adx/len,uy=ady/len,sz=1.5;
      var arrow=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      var px=last.x,py=last.y;
      arrow.setAttribute('points',px+','+py+' '+(px-ux*sz-uy*sz*.7)+','+(py-uy*sz+ux*sz*.7)+' '+(px-ux*sz+uy*sz*.7)+','+(py-uy*sz-ux*sz*.7));
      arrow.setAttribute('fill','var(--route,var(--accent))');
      arrow.setAttribute('opacity','.85');
      svg.appendChild(arrow);
    }
    
    for(var i=0;i<sorted.length-1;i++){
      var a=sorted[i],b=sorted[i+1];
      if(!a.distToNext)continue;
      var key=a.id+'_'+b.id;
      var nodes=(data.curves&&data.curves[key])||[];
      var mx,my;
      if(nodes.length){var nn=nodes[Math.floor(nodes.length/2)];mx=nn.x;my=nn.y}
      else{mx=(a.x+b.x)/2;my=(a.y+b.y)/2}
      var lbl=document.createElement('div');
      lbl.className='dist-label';
      lbl.textContent=fmtDist(a.distToNext);
      lbl.style.left=mx+'%';
      lbl.style.top=my+'%';
      inner.appendChild(lbl);
    }
  }
  
  function renderLiveMap(){
    if(typeof L==='undefined'){
      console.error('Leaflet not loaded');
      return;
    }
    var tiles={
      osm:{url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',attr:'&copy; OpenStreetMap contributors'},
      esri:{url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',attr:'&copy; Esri'},
      carto:{url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',attr:'&copy; OpenStreetMap &copy; CARTO'}
    };
    var map=L.map('mapView',{zoomControl:false,doubleClickZoom:false,attributionControl:false});
    L.control.zoom({position:'topright'}).addTo(map);
    var c=data.center||{lat:55.75,lng:37.62};
    map.setView([c.lat,c.lng],data.zoom||6);
    var tt=tiles[data.tileLayer]||tiles.osm;
    L.tileLayer(tt.url,{attribution:tt.attr,maxZoom:19}).addTo(map);
    
    var curvesMap=data.curvesMap||{};
    
    function segNodes(a,b){
      var key=a.id+'_'+b.id;
      var nodes=(curvesMap[key]||[]).slice();
      var dlat=b.lat-a.lat,dlng=b.lng-a.lng,len2=dlat*dlat+dlng*dlng;
      nodes.sort(function(n1,n2){
        var t1=len2>0?((n1.lat-a.lat)*dlat+(n1.lng-a.lng)*dlng)/len2:0;
        var t2=len2>0?((n2.lat-a.lat)*dlat+(n2.lng-a.lng)*dlng)/len2:0;
        return t1-t2;
      });
      return nodes;
    }
    
    var mapMarkers={};
    if(data.showRoutes&&sorted.length>1){
      var all=[];
      for(var i=0;i<sorted.length-1;i++){
        var a=sorted[i],b=sorted[i+1];
        var seq=[{lat:a.lat,lng:a.lng}].concat(segNodes(a,b)).concat([{lat:b.lat,lng:b.lng}]);
        var sm=crSamples(seq,16);
        if(i>0)sm.shift();
        all=all.concat(sm);
      }
      var animClass=animateRoute?'animated':'';
      var polyline=L.polyline(all,{color:accent,weight:3,dashArray:'8 6',opacity:.85,interactive:false,className:'route-path '+animClass});
      polyline.addTo(map);
    }
    
    sorted.forEach(function(p,i){
      var inner=p.icon?'<span class="mk-icon">'+esc(p.icon)+'</span>':'<span class="mk-num">'+(i+1)+'</span>';
      var icon=L.divIcon({className:'',html:'<div class="lm-pin" style="background:'+(p.color||'#e94560')+'">'+inner+'</div>',iconSize:[34,34],iconAnchor:[17,34]});
      var mk=L.marker([p.lat,p.lng],{icon:icon});
      mk.on('click',function(){showCard(p)});
      mk.addTo(map);
      mapMarkers[p.id]=mk;
    });
    
    (data.stickers||[]).forEach(function(s){
      if(typeof s.lat!=='number')return;
      var bg=s.bg==='transparent'?'transparent':(s.bg||'rgba(255,255,255,.8)');
      var html='<div class="sticker '+(s.font||'font-normal')+'" style="color:'+(s.textColor||'#1a1a1a')+';background:'+bg+';width:'+(s.mapWpx||180)+'px">'+esc(s.text||'')+'</div>';
      L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:html,iconSize:null}),interactive:false}).addTo(map);
    });
    
    if(data.showRoutes){
      for(var i=0;i<sorted.length-1;i++){
        var a=sorted[i];
        if(!a.distToNext)continue;
        var b=sorted[i+1];
        var ns=segNodes(a,b);
        var mid;
        if(ns.length){var nn=ns[Math.floor(ns.length/2)];mid=[nn.lat,nn.lng]}
        else{mid=[(a.lat+b.lat)/2,(a.lng+b.lng)/2]}
        L.marker(mid,{icon:L.divIcon({className:'',html:'<div class="lm-dist">'+esc(fmtDist(a.distToNext))+'</div>',iconSize:[0,0]}),interactive:false}).addTo(map);
      }
    }
    
    if(data.passport&&data.passport.visible){
      var pf=document.createElement('div');
      pf.className='passport';
      pf.style.position='absolute';
      pf.style.top='10px';
      pf.style.left='10px';
      pf.style.zIndex='800';
      var rows=[['📏',data.passport.distance],['📅',data.passport.days],['👥',data.passport.participants],['🗓️',data.passport.dates]];
      var ph='<h4>Паспорт маршрута</h4>';
      rows.forEach(function(r){ph+='<div class="passport-row"><span>'+r[0]+'</span><span>'+(r[1]?esc(r[1]):'—')+'</span></div>'});
      pf.innerHTML=ph;
      document.getElementById('mapOuter').appendChild(pf);
    }
    
    window._mapMarkers=mapMarkers;
  }
  
  function renderPoints(){
    var pl=document.getElementById('pointsList');
    if(sorted.length===0)return;
    
    var html='<h2>Точки маршрута</h2>';
    sorted.forEach(function(p,i){
      var imgCount=p.imageCount||0;
      var thumbHtml='';
      if(imgCount>0&&assetUrls.points&&assetUrls.points[i]&&assetUrls.points[i][0]){
        thumbHtml='<img class="point-thumb" src="'+assetUrls.points[i][0]+'" alt="">';
        if(imgCount>1){
          thumbHtml+='<div class="thumb-badge">+'+(imgCount-1)+'</div>';
        }
      }else{
        var color=p.color||'#e94560';
        var icon=p.icon||(i+1);
        thumbHtml='<div class="point-icon-circle" style="background:'+color+'">'+esc(icon)+'</div>';
      }
      html+='<div class="point-card" data-point-id="'+p.id+'">';
      html+='<div style="position:relative">'+thumbHtml+'</div>';
      html+='<div class="point-content"><h3>'+(p.icon?esc(p.icon)+' ':'')+(i+1)+'. '+esc(p.title)+'</h3>';
      if(p.description)html+='<div>'+fmtDesc(p.description)+'</div>';
      html+='</div></div>';
    });
    pl.innerHTML=html;
    
    pl.querySelectorAll('.point-card').forEach(function(card){
      card.addEventListener('click',function(){
        var pointId=card.dataset.pointId;
        var p=sorted.find(function(x){return x.id===pointId});
        if(!p)return;
        
        pl.querySelectorAll('.point-card').forEach(function(c){c.classList.remove('active')});
        card.classList.add('active');
        
        if(data.mode==='photo'){
          var mapWrap=document.getElementById('mapWrap');
          mapWrap.scrollIntoView({behavior:'smooth',block:'start'});
          var m=document.querySelector('.marker[data-point-id="'+p.id+'"]');
          if(m){
            m.classList.add('pulse');
            setTimeout(function(){m.classList.remove('pulse')},600);
          }
        }else{
          var mapOuter=document.getElementById('mapOuter');
          mapOuter.scrollIntoView({behavior:'smooth',block:'start'});
          if(typeof p.lat==='number'&&typeof p.lng==='number'&&window._mapMarkers){
            var mk=window._mapMarkers[p.id];
            if(mk){
              var currentZoom=window._map?window._map.getZoom():12;
              var targetZoom=Math.min(Math.max(currentZoom,12),15);
              window._map.flyTo([p.lat,p.lng],targetZoom,{duration:0.8});
              var iconEl=mk.getElement().querySelector('.lm-pin');
              if(iconEl){
                iconEl.classList.add('pulse');
                setTimeout(function(){iconEl.classList.remove('pulse')},600);
              }
            }
          }
        }
        
        setTimeout(function(){showCard(p)},400);
      });
    });
  }
  
  function renderVideos(){
    var floatingEls=[];
    function clampFloat(x,y,w,h){
      return {
        x:Math.max(8,Math.min(window.innerWidth-w-8,x)),
        y:Math.max(8,Math.min(window.innerHeight-h-8,y))
      };
    }
    function floatSize(v){
      var ratio=(v.ratio>0)?v.ratio:9/16;
      var w=(v.w>50)?v.w:240;
      var h=w*ratio;
      var maxH=window.innerHeight*0.62;
      if(h>maxH){h=maxH;w=h/ratio}
      var maxW=window.innerWidth*0.6;
      if(w>maxW){w=maxW;h=w/ratio}
      return {w:w,h:h};
    }
    function collapseFloat(el){
      if(el._video)el._video.pause();
      var pl=el.querySelector('.video-play');
      if(pl)pl.textContent='▶';
      el.classList.add('collapsed');
    }
    function collapseAllFloats(){
      floatingEls.forEach(function(el){
        if(!el.classList.contains('collapsed'))collapseFloat(el);
      });
    }
    
    (data.videos||[]).forEach(function(v,i){
      var src=v.external?v.fileName:(assetUrls.videos&&assetUrls.videos[i]);
      if(!src)return;
      var sz=floatSize(v);
      var el=document.createElement('div');
      el.className='video-float';
      el.style.width=sz.w+'px';
      el.style.height=sz.h+'px';
      var p0=clampFloat(window.innerWidth-sz.w-16-i*12,window.innerHeight-sz.h-16-i*12,sz.w,sz.h);
      el.style.transform='translate('+p0.x+'px,'+p0.y+'px)';
      el.dataset.x=p0.x;
      el.dataset.y=p0.y;
      var full=document.createElement('div');
      full.className='vf-full';
      var video=document.createElement('video');
      video.src=src;
      video.loop=true;
      video.playsInline=true;
      video.preload='metadata';
      video.muted=v.muted!==false;
      video.setAttribute('playsinline','');
      full.appendChild(video);
      var play=document.createElement('button');
      play.className='video-play';
      play.textContent='▶';
      play.addEventListener('pointerdown',function(e){e.stopPropagation()});
      play.addEventListener('click',function(e){
        e.stopPropagation();
        if(video.paused){video.play().catch(function(){});play.textContent='⏸'}
        else{video.pause();play.textContent='▶'}
      });
      full.appendChild(play);
      var col=document.createElement('button');
      col.className='vf-collapse';
      col.textContent='—';
      col.addEventListener('pointerdown',function(e){e.stopPropagation()});
      col.addEventListener('click',function(e){e.stopPropagation();collapseFloat(el)});
      full.appendChild(col);
      var mute=document.createElement('button');
      mute.className='vf-mute';
      mute.textContent=v.muted!==false?'🔇':'🔊';
      mute.addEventListener('pointerdown',function(e){e.stopPropagation()});
      mute.addEventListener('click',function(e){
        e.stopPropagation();
        video.muted=!video.muted;
        mute.textContent=video.muted?'🔇':'🔊';
      });
      full.appendChild(mute);
      var mini=document.createElement('button');
      mini.className='vf-mini';
      mini.textContent='▶';
      el.appendChild(full);
      el.appendChild(mini);
      var dragging=false,moved=false,sx=0,sy=0,ox=0,oy=0,wasPlaying=false;
      el.addEventListener('pointerdown',function(e){
        if(e.target.closest('.video-play')||e.target.closest('.vf-collapse')||e.target.closest('.vf-mute'))return;
        e.preventDefault();
        dragging=true;
        moved=false;
        sx=e.clientX;
        sy=e.clientY;
        ox=parseFloat(el.dataset.x)||0;
        oy=parseFloat(el.dataset.y)||0;
        if(video&&!video.paused){
          video.pause();
          wasPlaying=true;
        }
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove',function(e){
        if(!dragging)return;
        var dx=e.clientX-sx,dy=e.clientY-sy;
        if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
        if(!moved)return;
        var r=el.getBoundingClientRect();
        var pp=clampFloat(ox+dx,oy+dy,r.width,r.height);
        el.style.transform='translate('+pp.x+'px,'+pp.y+'px)';
        el.dataset.x=pp.x;
        el.dataset.y=pp.y;
      });
      function endDrag(e){
        if(!dragging)return;
        dragging=false;
        try{el.releasePointerCapture(e.pointerId)}catch(_){}
        if(wasPlaying&&video){
          video.play().catch(function(){});
          wasPlaying=false;
        }
        if(!moved&&el.classList.contains('collapsed')){
          el.classList.remove('collapsed');
          var rr=el.getBoundingClientRect();
          var ppp=clampFloat(parseFloat(el.dataset.x)||0,parseFloat(el.dataset.y)||0,rr.width,rr.height);
          el.style.transform='translate('+ppp.x+'px,'+ppp.y+'px)';
          el.dataset.x=ppp.x;
          el.dataset.y=ppp.y;
        }
      }
      el.addEventListener('pointerup',endDrag);
      el.addEventListener('pointercancel',endDrag);
      el._video=video;
      floatingEls.push(el);
      document.body.appendChild(el);
    });
    window.addEventListener('resize',function(){
      floatingEls.forEach(function(el){
        var r=el.getBoundingClientRect();
        var pp=clampFloat(parseFloat(el.dataset.x)||0,parseFloat(el.dataset.y)||0,r.width,r.height);
        el.style.transform='translate('+pp.x+'px,'+pp.y+'px)';
        el.dataset.x=pp.x;
        el.dataset.y=pp.y;
      });
    });
    window._collapseAllFloats=collapseAllFloats;
  }
  
  function showCard(p){
    if(window._collapseAllFloats)window._collapseAllFloats();
    closeCard();
    var ov=document.createElement('div');
    ov.className='overlay';
    ov.addEventListener('click',closeCard);
    var card=document.createElement('div');
    card.className='card';
    
    var imgs=[];
    var pi=sorted.indexOf(p);
    if(assetUrls.points&&assetUrls.points[pi]){
      imgs=assetUrls.points[pi].filter(function(u){return u});
    }
    
    var multi=imgs.length>1;
    var html='<button class="close">&times;</button><div class="card-inner">';
    html+='<h3 class="serif">'+(p.icon?esc(p.icon)+' ':'')+esc(p.title)+'</h3>';
    if(imgs.length){
      html+='<div class="carousel"><div class="car-viewport"><div class="car-track">';
      imgs.forEach(function(src){html+='<img src="'+src+'" alt="">'});
      html+='</div></div>';
      if(multi){
        html+='<button class="car-btn car-prev">&lsaquo;</button><button class="car-btn car-next">&rsaquo;</button>';
        html+='<div class="car-counter">1 / '+imgs.length+'</div><div class="car-dots">';
        imgs.forEach(function(_,i){html+='<div class="car-dot'+(i===0?' active':'')+'" data-i="'+i+'"></div>'});
        html+='</div>';
      }
      html+='</div>';
    }
    if(p.description)html+='<div class="text">'+fmtDesc(p.description)+'</div>';
    html+='</div>';
    card.innerHTML=html;
    card.querySelector('.close').addEventListener('click',closeCard);
    document.body.appendChild(ov);
    document.body.appendChild(card);
    window._ov=ov;
    window._card=card;
    if(multi)initCarousel(card.querySelector('.carousel'));
    var h=function(e){if(e.key==='Escape'){closeCard();document.removeEventListener('keydown',h)}};
    document.addEventListener('keydown',h);
  }
  
  function closeCard(){if(window._ov){window._ov.remove();window._ov=null}if(window._card){window._card.remove();window._card=null}}
  
  function initCarousel(car){
    var viewport=car.querySelector('.car-viewport');
    var track=car.querySelector('.car-track');
    var total=track.querySelectorAll('img').length;
    var idx=0,startX=0,currentX=0,dragging=false;
    function update(animate){
      if(animate)track.classList.remove('dragging');else track.classList.add('dragging');
      track.style.transform='translateX('+(-idx*100)+'%)';
      var c=car.querySelector('.car-counter');
      if(c)c.textContent=(idx+1)+' / '+total;
      car.querySelectorAll('.car-dot').forEach(function(d,i){d.classList.toggle('active',i===idx)});
    }
    var prev=car.querySelector('.car-prev'),next=car.querySelector('.car-next');
    if(prev)prev.addEventListener('click',function(){if(idx>0){idx--;update(true)}});
    if(next)next.addEventListener('click',function(){if(idx<total-1){idx++;update(true)}});
    car.querySelectorAll('.car-dot').forEach(function(d,i){d.addEventListener('click',function(){idx=i;update(true)})});
    viewport.addEventListener('pointerdown',function(e){
      if(e.target.closest('.car-btn'))return;
      dragging=true;
      startX=e.clientX;
      currentX=0;
      viewport.classList.add('grabbing');
      viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener('pointermove',function(e){
      if(!dragging)return;
      currentX=e.clientX-startX;
      var pct=(currentX/viewport.offsetWidth)*100;
      track.classList.add('dragging');
      track.style.transform='translateX('+(-idx*100+pct)+'%)';
    });
    function endDrag(e){
      if(!dragging)return;
      dragging=false;
      viewport.classList.remove('grabbing');
      try{viewport.releasePointerCapture(e.pointerId)}catch(_){}
      var thr=viewport.offsetWidth/4;
      if(currentX<-thr&&idx<total-1)idx++;
      else if(currentX>thr&&idx>0)idx--;
      update(true);
    }
    viewport.addEventListener('pointerup',endDrag);
    viewport.addEventListener('pointercancel',endDrag);
    update(true);
  }
  
  updateLoadingIndicator();
})();
</script>
